---
layout: default
---

<ul class="article-index">
  {% for post in site.posts %}
  <li class="article-index-row">
    <time class="article-index-date" datetime="{{ post.date | date: '%Y-%m-%d' }}">
      {{ post.date | date: "%b %d, %Y" }}
    </time>
    <a class="article-index-title" href="{{ post.url | relative_url }}" title="{{ post.title | escape }}">
      {{ post.title }}
    </a>
  </li>
  {% endfor %}
</ul>
